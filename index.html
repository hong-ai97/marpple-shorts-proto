<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마플 숏츠 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--or:#FF6B00;--orbg:#FFF0E5;--bk:#000;--g1:#5B5B5B;--g2:#858585;--line:#E8E8E8;--chip:#F6F6F6;--chipline:#D8D8D8;--ph:#E8E8E8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:#000;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
svg{display:block}
.ell1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#app{min-height:100%}
::-webkit-scrollbar{width:0;height:0}

/* ---------- PC GNB (기본 GNB 3단) ---------- */
.gnb{background:#fff;border-bottom:1px solid #EFEFEF}
.gnb .in{width:1625px;margin:0 auto}
.gnb .util{height:40px;display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--g1)}
.gnb .util .l{display:flex;gap:12px;font-weight:600}.gnb .util .l span+span::before{content:"";display:inline-block;width:1px;height:10px;background:#D8D8D8;margin:0 12px 0 0;vertical-align:-1px}
.gnb .util .r{display:flex;gap:16px;font-weight:500}
.gnb .mast{height:80px;display:flex;align-items:center;justify-content:space-between}
.gnb .mast .l{display:flex;align-items:center;gap:24px}
.gnb .search{width:480px;height:40px;border:1px solid #A5A5A5;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--g1);font-size:16px;font-weight:500}
.gnb .mast .r{display:flex;align-items:center;gap:32px}
.gnb .menu{display:flex;gap:24px;font-size:16px;font-weight:600}.gnb .menu span{display:flex;align-items:center;gap:6px}.gnb .menu .on{color:var(--or)}
.gnb .icons{display:flex;gap:16px}
.gnb .cat{height:56px;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}
.gnb .cat .l{display:flex;gap:32px;align-items:center}.gnb .cat .l span:first-child{display:flex;gap:8px;align-items:center}
.gnb .cat .r{display:flex;gap:12px;align-items:center}.gnb .cat .r i{width:1px;height:19px;background:#EFEFEF}

/* ---------- PC 목록 ---------- */
.pc-body{width:1625px;margin:0 auto;padding:28px 0 160px}
.pc-head{display:flex;flex-direction:column;gap:16px}
.pc-head h1{margin:0;font-size:24px;font-weight:600;line-height:1.2}
.chips{display:flex;gap:8px;overflow-x:auto;position:relative}
.chip{flex:none;height:44px;padding:10px 20px 10px 18px;border-radius:999px;background:var(--chip);display:flex;align-items:center;gap:6px;font-size:16px;font-weight:500;color:#000;white-space:nowrap}
.chip.on{background:#000;color:#fff;font-weight:700}
/* 이모지는 Figma(1em=16px)보다 브라우저가 넓게 그리므로 칸을 고정 */
.chip span{flex:none;width:16px;display:flex;justify-content:center;font-size:15px;line-height:1}
.mo-body .chip span{width:13px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:48px 12px;margin-top:28px}
.card{display:flex;flex-direction:column;gap:16px;cursor:pointer}
.thumb{position:relative;border-radius:12px;overflow:hidden;background:var(--ph);aspect-ratio:315/473}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .prev{position:absolute;inset:0;opacity:0;transition:opacity .25s;overflow:hidden;background:#000}
.thumb .prev.show{opacity:1}
/* 16:9 플레이어를 카드보다 크게 키워 가운데 세로 영상만 보이게(cover). 좌우 검은 띠와 유튜브 제목/로고/진행바가 잘린 영역 밖으로 나간다 */
.thumb .prev iframe{position:absolute;left:50%;top:50%;width:340%;height:auto;aspect-ratio:16/9;transform:translate(-50%,-50%);border:0;pointer-events:none}
.thumb .cap{position:absolute;inset:0}
.badge{position:absolute;left:16px;top:16px;height:26px;padding:0 12px;border-radius:4px;background:var(--orbg);color:var(--or);font-size:13px;font-weight:700;display:flex;align-items:center}
/* 스켈레톤 (추가 로드 중) */
.skel .thumb,.skel .line,.skel .pimg{background:#F2F2F2;position:relative;overflow:hidden}
.skel .thumb::after,.skel .line::after,.skel .pimg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 100%);transform:translateX(-100%);animation:shimmer 1.3s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skel .line{height:20px;border-radius:4px;width:72%}
.skel .ptile .line{height:14px;width:60%}.skel .ptile .line+.line{width:36%;margin-top:8px}
.sentinel{height:1px}
@media (prefers-reduced-motion:reduce){.skel .thumb::after,.skel .line::after,.skel .pimg::after{animation:none}}
.play{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:999px;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.card .info{display:flex;flex-direction:column;gap:12px;padding:0 8px}
.card .title{font-size:20px;font-weight:600;line-height:1.5}
.ptile{display:flex;align-items:center;gap:10px;min-width:0}
/* 사진 배경(흰색/연회색)이 제각각이라, 타일 회색보다 밝은 부분은 타일 색으로 눌러 톤을 통일 */
.ptile .pimg{width:60px;height:60px;border-radius:8px;background:var(--ph);overflow:hidden;flex:none}.ptile .pimg img{width:100%;height:100%;object-fit:cover}
.ptile .pimg img[src*="/p_"],.ptile .pimg img[src*="/m_"]{object-fit:contain;mix-blend-mode:darken}
.ptile .pt{display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1;min-width:0}.ptile .pt b{font-weight:700}
.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.card{min-width:0}

/* ---------- PC 뷰어 모달 ---------- */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;align-items:center;justify-content:center}
.mwrap{position:relative;height:min(980px,calc(100vh - 100px))}
.modal{height:100%;display:flex;border-radius:16px;overflow:hidden;background:#fff}
.vcol{height:100%;aspect-ratio:552/980;background:#000;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000}
.slide .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6)}
.slide .mount{position:absolute;inset:0}.slide .mount iframe{width:100%;height:100%;border:0}
.panel{width:400px;height:100%;display:flex;flex-direction:column;background:#fff}
.panel .hd{height:48px;flex:none;display:flex;justify-content:flex-end;align-items:flex-start;gap:12px;padding:24px 24px 0}
.panel .bd{flex:1;overflow-y:auto;padding:8px 24px 40px;display:flex;flex-direction:column;gap:48px}
.badges{display:flex;gap:2px}
.bd .badges .b{height:26px;padding:0 12px;border-radius:4px;font-size:13px;font-weight:700;display:flex;align-items:center}
.b.hot{background:var(--orbg);color:var(--or)}
.b.tag{background:#EFEFEF;color:#000}
.vtitle{font-size:20px;font-weight:600;line-height:1.5;margin-top:8px}
.sec h3{margin:0 0 16px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec h3 .more{font-size:12px;font-weight:500;color:var(--g2);display:flex;align-items:center;gap:2px}
.prow{display:flex;align-items:center;gap:14px}
.prow>.go{display:flex;align-items:center;gap:14px;flex:1;min-width:0}.sheet .prow>.go{gap:16px}
.like.on svg path{fill:#FF6B00}
.prow .pimg{flex:none;width:72px;height:90px;border-radius:6px;background:var(--ph);overflow:hidden}.prow .pimg.s{width:56px;height:70px;border-radius:4px}
.prow .pimg img{width:100%;height:100%;object-fit:cover}
.prow .pt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.prow .nm{font-size:14px;font-weight:500;line-height:1.5}.prow .pr{font-size:14px;font-weight:700;line-height:1.5}
.prow.main .nm,.prow.main .pr,.plist.big .nm,.plist.big .pr{font-size:15px}
.rate{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--g2);line-height:1.5}.rate b{color:var(--or);font-weight:500}
.cta{margin-top:16px;height:36px;width:100%;border-radius:6px;background:var(--or);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.plist{display:flex;flex-direction:column;gap:10px}
.sheet .rate{font-size:12px}.sheet .cta{font-weight:600}.sheet .sec h3 .more{font-size:14px}
/* 등록 상품이 없는 카드: 인기상품을 노출하되 가격 대신 "더 보러가기"로 구분 */
.ptile.pop .pt{gap:8px}
.ptile.pop .more{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:700;color:var(--g1);line-height:1}
.mcard .ptile.pop .pt{gap:0}.mcard .ptile.pop .more{font-size:13px;line-height:20px}.mcard .ptile.pop .more svg{width:12px;height:12px}
.nav{position:absolute;right:-72px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.nav button{width:44px;height:44px;border-radius:999px;background:#fff;display:flex;align-items:center;justify-content:center}
.nav button[disabled]{opacity:.35;cursor:default}

/* ---------- 메인 ---------- */
.main-canvas{position:relative;margin:0 auto}
.mimg{background-repeat:no-repeat}
.main-sec{width:1625px;margin:0 auto;padding:0;height:636px;display:flex;flex-direction:column;gap:16px}
.main-sec .th{display:flex;justify-content:space-between;align-items:center}
.main-sec .th h2{margin:0;font-size:24px;font-weight:600;line-height:1.2}
.main-sec .th a{font-size:16px;font-weight:500;display:flex;align-items:center;gap:2px}
.main-sec .row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}

/* ---------- MO 공통 ---------- */
.mo-bar{height:64px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;background:#fff;position:sticky;top:0;z-index:5}
.mo-bar .l,.mo-bar .r{display:flex;gap:8px;align-items:center;width:110px}.mo-bar .r{justify-content:flex-end;gap:12px}
.mo-bar .t{font-size:18px;font-weight:500}

/* ---------- MO 목록 ---------- */
.mo-body{padding:12px 0 80px}
.mo-body .chips{padding:0 20px}
.mo-body .chip{height:36px;padding:6px 14px 6px 12px;font-size:13px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 8px;padding:16px 20px 0}
.mcard{display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.mcard .thumb{aspect-ratio:164/245}
.mcard .badge{left:10px;top:10px;height:24px;padding:0 8px;font-size:12px}
.mcard .play{right:10px;top:10px;width:24px;height:24px;background:rgba(0,0,0,.6)}
.mcard .info{display:flex;flex-direction:column;gap:8px}
.mcard .title{padding:0 4px;font-size:14px;font-weight:500;line-height:1.5}
.mcard .ptile{padding:0 4px;gap:8px}.mcard .ptile .pimg{width:44px;height:44px;border-radius:4px}
.mcard .ptile .pt{gap:0;font-size:13px;line-height:20px;color:var(--g1)}

/* ---------- MO 뷰어 ---------- */
.mv{height:100dvh;display:flex;flex-direction:column;background:#fff}
.mv .mo-bar{position:static;flex:none}
.msnap{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
/* Figma MO 뷰어: 제목 블록(44) + 영상 영역(flex) + 상품 스트립(86). 영상은 영상 영역 안에서만 꽉 채움(상하 크롭) */
.mslide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;background:#fff}
.mtb{flex:none;padding:10px 16px;display:flex;align-items:center;gap:10px;height:44px}
.mtb .badges .b{height:24px;padding:0 8px;font-size:12px;font-weight:600;border-radius:4px;display:flex;align-items:center}
.mtb .vt{flex:1;min-width:0;font-size:15px;font-weight:600}
.mvideo{flex:1;min-height:0;position:relative;background:#000;overflow:hidden}
/* 모바일: 플레이어를 정확히 9:16으로 두어 유튜브 UI를 전혀 자르지 않고(좌우 여백도 유튜브 고유값),
   영역이 9:16보다 넓어 남는 양옆 공간은 검은색 대신 썸네일을 흐리게 깔아 채운다 */
.mvideo .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.4);filter:blur(22px) brightness(1.05) saturate(1.15)}
.mvideo .mount{position:absolute;inset:0}
.mvideo .mount iframe{position:absolute;top:0;left:50%;height:100%;width:auto;aspect-ratio:9/16;max-width:100%;transform:translateX(-50%);border:0}
.strip{flex:none;height:86px;position:relative;display:flex;align-items:center;background:#fff}
.strip .sc{display:flex;gap:8px;overflow-x:auto;padding:12px 56px 12px 16px;align-items:center;height:100%}
.pcard{flex:none;width:264px;height:62px;border:1px solid var(--line);border-radius:4px;display:flex;align-items:center;gap:16px;padding-right:12px;background:#fff}
.pcard .pimg{width:48px;height:60px;overflow:hidden;flex:none;border-radius:3px 0 0 3px;background:var(--ph)}.pcard .pimg img{width:100%;height:100%;object-fit:cover}
.pcard .pt{min-width:0;font-size:13px;line-height:20px}.pcard .pt b{display:block;font-weight:700}
.strip .open{position:absolute;right:0;top:0;bottom:0;width:56px;padding:0 16px 0 20px;display:flex;align-items:center;justify-content:flex-end;background:linear-gradient(90deg,rgba(255,255,255,0) 0,#fff 31%)}
.strip .open i{width:20px;height:20px;border-radius:999px;background:#fff;border:1px solid #E5E5E5;display:flex;align-items:center;justify-content:center}
/* 코치마크 */
.coach{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:6;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.coach .in{display:flex;flex-direction:column;align-items:center;gap:20px;width:192px}
.coach .hand{width:120px;height:168px}
.coach p{margin:0;font-size:20px;font-weight:600;line-height:1.5}.coach p em{font-style:normal;color:var(--or)}
.coach button{height:36px;padding:0 20px;border-radius:999px;background:rgba(255,255,255,.3);color:#fff;font-size:14px;font-weight:500}
/* 바텀시트 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
/* 높이는 내용만큼(하단 여백 24). 화면의 80%를 넘으면 80%로 고정하고 내부 스크롤 */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:80%;background:#fff;border-radius:16px 16px 0 0;z-index:21;display:flex;flex-direction:column;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);animation:up .25s ease-out forwards}
@keyframes up{to{transform:none}}
.sheet .hdl{width:36px;height:4px;border-radius:999px;background:#D8D8D8;margin:0 auto 16px;flex:none}
.sheet .bd{flex:0 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:32px}
/* 바텀시트 내부: Figma 값(섹션 제목→목록 12, 행 간격 8, 썸네일 64×80, CTA 36/r4) */
.sheet .sec h3{margin-bottom:12px}
.sheet .prow{gap:16px}.sheet .prow .pimg,.sheet .prow .pimg.s{width:64px;height:80px;border-radius:4px}
.sheet .prow .pt{gap:0}.sheet .prow .nm,.sheet .prow .pr{font-size:14px}.sheet .rate{margin-top:4px}
.sheet .plist{gap:8px}.sheet .cta{margin-top:8px;border-radius:4px}
.sheet .sec h3 .more svg{width:16px;height:16px}

/* 프로토 네비 */
.devnav{position:fixed;left:12px;bottom:12px;z-index:99;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);font-size:12px;color:#fff}
.devnav a{padding:6px 10px;border-radius:999px}.devnav a.on{background:#fff;color:#000;font-weight:700}
@media (max-width:767px){.devnav{left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom))}body:has(.mv) .devnav{bottom:calc(118px + env(safe-area-inset-bottom,0px))}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="devnav" id="devnav"></nav>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ===================== 데이터 ===================== */
const TAGS=[["전체","👀"],["가족·반려동물","❤️"],["커플·우정","👩‍❤️‍👨"],["스포츠","⚾️"],["여행","✈️"],["덕질","🔥"],["단체·기업","🏢"],["선물","🎁"]];

const VIDEOS=[
  V("tXgOdJe-fao","친구랑 랜덤 옷 교환하기ㅋㅋ",["커플·우정"],"card_blue",1),
  V("CmHoL2Q8UL8","ENTJ 누나의 동생 선물 🎁",["선물","가족·반려동물"],"tee_yellow",1),

/* ===================== YouTube IFrame API ===================== */
// API 로드 콜백이 이 스크립트보다 먼저 올 수 있어(캐시) YT.Player 존재 여부도 함께 본다
let ytQ=[];const ytOK=()=>!!(window.YT&&window.YT.Player);
window.onYouTubeIframeAPIReady=()=>{ytQ.splice(0).forEach(f=>f())};
const whenYT=f=>{if(ytOK())return f();ytQ.push(f);const t=setInterval(()=>{if(ytOK()){clearInterval(t);ytQ.splice(0).forEach(g=>g())}},100)};

/* 썸네일 호버 미리보기: 영상 중간 4초를 무음 루프 재생 (PC) */
const preview={card:null,player:null,timer:null,iv:null,mid:0};
function previewStop(){
  clearTimeout(preview.timer);clearInterval(preview.iv);
  if(preview.player){try{preview.player.destroy()}catch(e){}}
  if(preview.card){const p=preview.card.querySelector(".prev");if(p){p.classList.remove("show");p.innerHTML=""}}
  preview.card=null;preview.player=null;preview.iv=null;
}
function previewStart(card,id){
  previewStop();preview.card=card;
  preview.timer=setTimeout(()=>whenYT(()=>{
    if(preview.card!==card)return;
    const box=card.querySelector(".prev");
    // iframe을 직접 만들어 autoplay 권한을 명시 (API가 만든 iframe은 브라우저 자동재생 정책에 막히는 경우가 있음)
    const f=document.createElement("iframe");
    f.allow="autoplay; encrypted-media; picture-in-picture";
    f.src=`https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&playsinline=1&disablekb=1&fs=0&iv_load_policy=3&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
    box.appendChild(f);
    const LOOP=4;preview.mid=0;
    const kick=p=>{try{p.mute();p.playVideo()}catch(x){}};
    preview.player=new YT.Player(f,{events:{
      onReady:e=>{const p=e.target;const d=p.getDuration();preview.mid=d?Math.max(0,d/2-LOOP/2):0;if(d)p.seekTo(preview.mid,true);kick(p);
        // 미시작 상태에 머물면 몇 번 더 재생 시도
        let tries=0;const t=setInterval(()=>{if(preview.player!==p||tries++>5)return clearInterval(t);try{const s=p.getPlayerState();if(s===-1||s===5||s===2)kick(p);else clearInterval(t)}catch(x){clearInterval(t)}},600);},
      onStateChange:e=>{
        const p=e.target;
        if(e.data===YT.PlayerState.PLAYING){
          if(!preview.mid){const d=p.getDuration();if(d){preview.mid=Math.max(0,d/2-LOOP/2);p.seekTo(preview.mid,true)}}
          box.classList.add("show");
          clearInterval(preview.iv);
          preview.iv=setInterval(()=>{try{if(p.getCurrentTime()>preview.mid+LOOP)p.seekTo(preview.mid,true)}catch(x){}},200);
        }
        if(e.data===YT.PlayerState.ENDED)p.seekTo(preview.mid,true);
      }}});
  }),300);
}

const feed={loaded:0,busy:false,io:null};

  }
  // 탭 클릭: 탭 그룹은 그대로 두고(스크롤 위치 유지) 그리드만 다시 그린다
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    state.tag=b.dataset.tag;
    app.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));
    revealChip(b);renderGrid();window.scrollTo(0,0);

// 화면에 다 보이는 탭은 스크롤 없이 선택 표시만 바뀐다. 잘려 있는 탭을 눌렀을 때만 왼쪽 끝(좌측 여백 자리)으로 붙이고, 뒤쪽 탭이 모자라면 끝까지만 간다
function revealChip(b){
  const sc=b.parentElement,pad=parseFloat(getComputedStyle(sc).paddingLeft||0);
  const r=b.getBoundingClientRect(),s=sc.getBoundingClientRect();
  if(r.left>=s.left&&r.right<=s.right)return;
  sc.scrollTo({left:b.offsetLeft-pad,behavior:"smooth"});
}
function renderGrid(){
  const mo=isMO(),grid=app.querySelector(".grid,.mgrid");
  feed.loaded=0;feed.busy=false;if(feed.io){feed.io.disconnect();feed.io=null}
  grid.innerHTML=Array.from({length:Math.min(PAGE,MAX_ITEMS)},(_,i)=>cardHtml(feedItem(i),mo)).join("");feed.loaded=PAGE;
  bindList(grid);
  // 아래로 스크롤하면 스켈레톤을 보여준 뒤 다음 10개를 붙인다
  feed.io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting))loadMore()},{rootMargin:"600px 0px"});
  feed.io.observe(app.querySelector(".sentinel"));
}
function loadMore(){
  if(feed.busy||feed.loaded>=MAX_ITEMS)return;
  const mo=isMO(),grid=app.querySelector(".grid,.mgrid");if(!grid)return;
  feed.busy=true;
  const n=Math.min(PAGE,MAX_ITEMS-feed.loaded);
  grid.insertAdjacentHTML("beforeend",Array.from({length:mo?4:5},()=>skelHtml(mo)).join(""));
  setTimeout(()=>{
    grid.querySelectorAll(".skel").forEach(s=>s.remove());
    const frag=document.createElement("div");frag.innerHTML=Array.from({length:n},(_,i)=>cardHtml(feedItem(feed.loaded+i),mo)).join("");
    const nodes=[...frag.children];nodes.forEach(c=>grid.appendChild(c));
    feed.loaded+=n;feed.busy=false;bindList(grid,nodes);
    if(feed.loaded>=MAX_ITEMS&&feed.io){feed.io.disconnect();return}
    // 감지 지점이 아직 화면 근처면 콜백이 다시 오지 않으므로, 다시 관찰을 걸어 다음 로드가 이어지게 한다
    const s=app.querySelector(".sentinel");if(feed.io&&s){feed.io.unobserve(s);feed.io.observe(s)}
  },900);
}
function bindList(root,nodes){
  (nodes||root.querySelectorAll(".card:not(.skel),.mcard:not(.skel)")).forEach(c=>{
    c.onclick=()=>{previewStop();go("viewer/"+c.dataset.id)};
    if(!isMO()){c.onmouseenter=()=>previewStart(c,c.dataset.id);c.onmouseleave=()=>{if(preview.card===c)previewStop()};}
  });
}

/* ===================== 화면: PC 뷰어(모달) ===================== */
const viewer={list:[],idx:0,player:null,io:null,hashLock:false};
function renderViewerPC(id){
  if(!app.querySelector(".pc-body"))renderList();
  previewStop();
  viewer.list=filtered().some(v=>v.id===id)?filtered():VIDEOS;
  viewer.idx=Math.max(0,viewer.list.findIndex(v=>v.id===id));
  const old=document.querySelector(".ov");if(old)old.remove();
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="mwrap"><div class="modal">
    <div class="vcol">${viewer.list.map((v,i)=>`<div class="slide" data-i="${i}"><img class="poster" src="${thumbUrl(v.id)}" alt="" ${thumbFallback}><div class="mount"></div></div>`).join("")}</div>
    <aside class="panel"><div class="hd"><button aria-label="공유">${I.share}</button><button class="x" aria-label="닫기">${I.close}</button></div><div class="bd"></div></aside>
    </div>
    <div class="nav"><button class="prev" aria-label="이전 쇼츠">${I.up}</button><button class="next" aria-label="다음 쇼츠">${I.down}</button></div>
  </div>`;
  document.body.appendChild(ov);document.body.style.overflow="hidden";
  const vcol=ov.querySelector(".vcol");
  const close=()=>{destroyPlayer();ov.remove();document.body.style.overflow="";if(location.hash.startsWith("#viewer"))go("list")};
  ov.querySelector(".x").onclick=close;
  ov.addEventListener("click",e=>{if(e.target===ov)close()});
  ov.querySelector(".prev").onclick=()=>scrollToSlide(viewer.idx-1);
  ov.querySelector(".next").onclick=()=>scrollToSlide(viewer.idx+1);
  // 패널/배경 위에서 휠을 굴려도 영상이 넘어가도록
  let wl=0;ov.addEventListener("wheel",e=>{if(vcol.contains(e.target))return;const now=Date.now();if(now-wl<700)return;wl=now;scrollToSlide(viewer.idx+(e.deltaY>0?1:-1))},{passive:true});
  document.onkeydown=e=>{if(e.key==="Escape")close();if(e.key==="ArrowDown")scrollToSlide(viewer.idx+1);if(e.key==="ArrowUp")scrollToSlide(viewer.idx-1)};
  viewer.io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting&&en.intersectionRatio>.6)activate(+en.target.dataset.i)})},{root:vcol,threshold:[.6]});
  vcol.querySelectorAll(".slide").forEach(s=>viewer.io.observe(s));
  vcol.scrollTop=viewer.idx*vcol.clientHeight;
  activate(viewer.idx,true);
  function scrollToSlide(i){i=Math.max(0,Math.min(viewer.list.length-1,i));vcol.scrollTo({top:i*vcol.clientHeight,behavior:"smooth"})}
  function activate(i,force){
    if(i===viewer.idx&&!force&&viewer.player)return;
    viewer.idx=i;const v=viewer.list[i];
    ov.querySelector(".bd").innerHTML=panelBodyHtml(v);
    ov.querySelector(".prev").disabled=i===0;ov.querySelector(".next").disabled=i===viewer.list.length-1;
    history.replaceState(null,"","#viewer/"+v.id);
    mountPlayer(vcol.children[i].querySelector(".mount"),v.id);
  }
}
function destroyPlayer(){if(viewer.player){try{viewer.player.destroy()}catch(e){}viewer.player=null}document.querySelectorAll(".mount").forEach(m=>m.innerHTML="")}
function mountPlayer(mount,id){
  destroyPlayer();mount.innerHTML='<div></div>';
  whenYT(()=>{if(!mount.isConnected)return;viewer.player=new YT.Player(mount.firstChild,{videoId:id,playerVars:{autoplay:1,controls:1,rel:0,modestbranding:1,playsinline:1,loop:1,playlist:id},events:{onReady:e=>e.target.playVideo()}})});
}

    history.replaceState(null,"","#viewer/"+v.id);

  sh.innerHTML=`<div class="hdl"></div><div class="bd">
    ${p?`<section class="sec"><h3>이 영상 속 상품</h3>${prowHtml(p,false,true)}<a class="cta" href="${p.url}" target="_blank" rel="noopener">내 디자인으로 만들어보기</a></section>`:""}
    <section class="sec"><h3>이런 상품도 인기있어요🔥<a class="more" href="${BEST_URL}" target="_blank" rel="noopener">더보기 ${I.chevR}</a></h3><div class="plist">${pop.map(k=>prowHtml(PRODUCTS[k],true,true)).join("")}</div></section></div>`;
  const close=()=>{dim.remove();sh.remove()};dim.onclick=close;
  document.body.append(dim,sh);
}

/* ===================== 화면: 메인 ===================== */
function renderMain(){
  if(isMO()){
    app.innerHTML=`<div class="main-canvas mo" style="width:375px">
      <div class="mimg" style="height:774px;background-image:url(assets/main_mo.png);background-size:375px auto"></div>
      <section class="main-sec mo" style="width:375px;height:auto;gap:16px;padding:0">
        <div class="th" style="padding:0 16px"><h2 style="font-size:20px">숏츠로 만나는 마플 굿즈</h2><a href="#list">더 보기 ${I.chevR16}</a></div>
        <div style="display:flex;gap:8px;overflow-x:auto;padding:0 16px">${VIDEOS.slice(0,6).map(v=>`<div style="flex:none;width:164px">${cardHtml(v,true)}</div>`).join("")}</div>
      </section>
      <div class="mimg" style="height:${4065-1207}px;background-image:url(assets/main_mo.png);background-size:375px auto;background-position:0 -1207px;margin-top:40px"></div></div>`;
  }else{
    app.innerHTML=`<div class="main-canvas" style="width:1920px">
      <div class="mimg" style="height:965px;background-image:url(assets/main_pc.png);background-size:1920px auto"></div>
      <section class="main-sec"><div class="th"><h2>숏츠로 만나는 마플 굿즈</h2><a href="#list">더 보기 ${I.chevR16}</a></div><div class="row">${VIDEOS.slice(0,5).map(v=>cardHtml(v,false)).join("")}</div></section>
      <div class="mimg" style="height:${4074-1681}px;background-image:url(assets/main_pc.png);background-size:1920px auto;background-position:0 -1681px;margin-top:80px"></div></div>`;
  }
  fitMain();bindList();
}
function fitMain(){const c=app.querySelector(".main-canvas");if(!c)return;const w=isMO()?375:1920;c.style.zoom=Math.min(1,window.innerWidth/w);}

/* ===================== 렌더 ===================== */
let lastDevice=isMO();
function render(){
  const r=route();
  document.querySelectorAll(".ov,.dim,.sheet").forEach(n=>n.remove());document.body.style.overflow="";document.onkeydown=null;
  if(viewer.io){viewer.io.disconnect();viewer.io=null}
  destroyPlayer();previewStop();
  if(r.name==="main")renderMain();
  else if(r.name==="list")renderList();
  else if(isMO())renderViewerMO(r.id);
  else renderViewerPC(r.id);
  window.scrollTo(0,0);
  document.getElementById("devnav").innerHTML=[["main","메인"],["list","숏츠 목록"],["viewer/"+VIDEOS[0].id,"숏츠 뷰어"]].map(([h,t])=>`<a href="#${h}" class="${r.name===h.split("/")[0]?"on":""}">${t}</a>`).join("");
}
window.addEventListener("hashchange",render);
window.addEventListener("resize",()=>{fitMain();if(lastDevice!==isMO()){lastDevice=isMO();render()}});
render();
</script>
</body>
</html>
